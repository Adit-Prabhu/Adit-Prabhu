<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Adit Prabhu — M.S. CS @ Columbia · AI Systems, ML Engineering &amp; Game Dev</title>
  <desc id="hero-desc">Matte-obsidian Swiss-grid architectural GitHub profile banner for Adit Prabhu with restrained 2D pixel-art chess knight and character sprite accents.</desc>

  <defs>
    <pattern id="swiss-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#232732" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111318" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#111318" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0.72"/>
    </linearGradient>

    <clipPath id="outer-clip">
      <rect x="1" y="1" width="898" height="238" rx="10"/>
    </clipPath>

    <clipPath id="viewport-clip">
      <rect x="656" y="52" width="224" height="136" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .display { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .breathe { animation: lab-breathe 2.2s ease-in-out infinite; }
    .bob-a { animation: sprite-bob 3.6s ease-in-out infinite; }
    .bob-b { animation: sprite-bob 3.6s ease-in-out 1.8s infinite; }

    @keyframes lab-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.38; }
    }
    @keyframes sprite-bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .bob-a, .bob-b { animation: none; }
    }
  </style>

  <!-- Outer Matte-Obsidian Architectural Frame -->
  <g clip-path="url(#outer-clip)">
    <rect x="1" y="1" width="898" height="238" fill="#111318"/>
    <rect x="1" y="38" width="898" height="166" fill="url(#swiss-grid)"/>
    <rect x="1" y="38" width="898" height="166" fill="url(#grid-fade)"/>

    <!-- Top Architectural Header Strip (37px) -->
    <rect x="1" y="1" width="898" height="37" fill="#161922"/>
    <line x1="1" y1="38" x2="899" y2="38" stroke="#232732" stroke-width="1"/>

    <!-- Minimal Swiss Geometric Mark -->
    <g shape-rendering="crispEdges">
      <rect x="20" y="14" width="4" height="4" fill="#f2f2ee"/>
      <rect x="26" y="14" width="4" height="4" fill="#22d3ee"/>
      <rect x="20" y="20" width="4" height="4" fill="#353b4b"/>
      <rect x="26" y="20" width="4" height="4" fill="#f2f2ee"/>
    </g>

    <text x="38" y="23" class="mono" font-size="10.5" font-weight="600" fill="#f2f2ee" letter-spacing="1.4">
      ADIT PRABHU
      <tspan fill="#767670" font-weight="400" letter-spacing="0.4">  /  </tspan>
      <tspan fill="#a9a9a3" font-weight="500" font-size="10" letter-spacing="0.6">github.com/Adit-Prabhu</tspan>
    </text>

    <!-- Right Live Status Pill (left-aligned after dot -> zero overlap across fonts) -->
    <rect x="668" y="9.5" width="212" height="20" rx="5" fill="#111318" stroke="#232732" stroke-width="1"/>
    <circle class="breathe" cx="681" cy="19.5" r="3" fill="#34d399"/>
    <text x="692" y="23" class="mono" font-size="9.5" font-weight="500" fill="#a9a9a3" text-anchor="start" letter-spacing="0.7">
      NEW YORK, NY · M.S. CS
    </text>

    <!-- Left Editorial Content Column (x=28..640) -->
    <text x="28" y="67" class="mono" font-size="9.8" font-weight="600" fill="#767670" letter-spacing="1.3">
      AI SYSTEMS · ML ENGINEERING · GAME DEV · PRIVACY RESEARCH
    </text>

    <!-- Main Heading + Restrained USCF NM Pill -->
    <text x="28" y="114" class="display" font-size="38" font-weight="700" fill="#f2f2ee" letter-spacing="-0.8">
      Adit Prabhu
    </text>

    <rect x="276" y="90" width="174" height="23" rx="5" fill="#fbbf24" fill-opacity="0.11" stroke="#fbbf24" stroke-opacity="0.36" stroke-width="1"/>
    <circle cx="289" cy="101.5" r="2.8" fill="#fbbf24"/>
    <text x="299" y="105" class="mono" font-size="9.5" font-weight="600" fill="#fbbf24" text-anchor="start" letter-spacing="0.6">
      USCF NATIONAL MASTER
    </text>

    <!-- Editorial Subtitle -->
    <text x="28" y="143" class="sans" font-size="13.2" font-weight="500" fill="#a9a9a3">
      M.S. CS @ Columbia (4.0) · AI/ML @ Rivian &amp; VW, RBC, MUFG · PoPETs '25
    </text>

    <!-- Surgical Accent Chips Row -->
    <g>
      <rect x="28" y="162" width="146" height="24" rx="5" fill="#161922" stroke="#232732" stroke-width="1"/>
      <circle cx="40" cy="174" r="2.8" fill="#22d3ee"/>
      <text x="50" y="177.5" class="mono" font-size="9.8" font-weight="500" fill="#f2f2ee" text-anchor="start">AI Agents &amp; LLMs</text>

      <rect x="182" y="162" width="156" height="24" rx="5" fill="#161922" stroke="#232732" stroke-width="1"/>
      <circle cx="194" cy="174" r="2.8" fill="#f472b6"/>
      <text x="204" y="177.5" class="mono" font-size="9.8" font-weight="500" fill="#f2f2ee" text-anchor="start">Game AI &amp; Physics</text>

      <rect x="346" y="162" width="148" height="24" rx="5" fill="#161922" stroke="#232732" stroke-width="1"/>
      <circle cx="358" cy="174" r="2.8" fill="#a78bfa"/>
      <text x="368" y="177.5" class="mono" font-size="9.8" font-weight="500" fill="#f2f2ee" text-anchor="start">Cloud &amp; MLOps</text>

      <rect x="502" y="162" width="106" height="24" rx="5" fill="#161922" stroke="#232732" stroke-width="1"/>
      <circle cx="514" cy="174" r="2.8" fill="#34d399"/>
      <text x="524" y="177.5" class="mono" font-size="9.8" font-weight="500" fill="#f2f2ee" text-anchor="start">PoPETs '25</text>
    </g>

    <!-- Right Recessed Dark Bezel: Tasteful 2D Pixel-Art Viewport -->
    <g clip-path="url(#viewport-clip)">
      <rect x="656" y="52" width="224" height="136" fill="#0b101b"/>
      <!-- Subtle ground plinth tiles -->
      <g shape-rendering="crispEdges">
        <rect x="656" y="154" width="224" height="34" fill="#0f1524"/>
        <line x1="656" y1="154" x2="880" y2="154" stroke="#252a38" stroke-width="1"/>
        <!-- Subtle monochrome mini chessboard strip -->
        <rect x="676" y="156" width="12" height="6" fill="#1c202b"/>
        <rect x="700" y="156" width="12" height="6" fill="#1c202b"/>
        <rect x="724" y="156" width="12" height="6" fill="#1c202b"/>
        <rect x="748" y="156" width="12" height="6" fill="#1c202b"/>
        <rect x="772" y="156" width="12" height="6" fill="#1c202b"/>
        <rect x="796" y="156" width="12" height="6" fill="#1c202b"/>
        <rect x="820" y="156" width="12" height="6" fill="#1c202b"/>
        <rect x="844" y="156" width="12" height="6" fill="#1c202b"/>
      </g>

      <!-- Bezel Micro Header -->
      <text x="668" y="67" class="mono" font-size="8.5" font-weight="600" fill="#767670" letter-spacing="1.1">
        2D PIXEL SPECIMENS
      </text>
      <circle class="breathe" cx="867" cy="64" r="2.4" fill="#22d3ee"/>

      <!-- Left Sprite: Refined 14x16 Pixel Chess Knight (4px scale -> 56x64 at x=690, y=84) -->
      <g class="bob-a">
        <g transform="translate(690, 84) scale(4)" shape-rendering="crispEdges">
          <!-- Crisp slate/cyan silhouette -->
          <rect x="5" y="0" width="2" height="1" fill="#22d3ee"/>
          <rect x="4" y="1" width="1" height="1" fill="#353b4b"/>
          <rect x="7" y="1" width="2" height="1" fill="#22d3ee"/>
          <rect x="3" y="2" width="1" height="1" fill="#353b4b"/>
          <rect x="9" y="2" width="1" height="1" fill="#22d3ee"/>
          <rect x="2" y="3" width="1" height="2" fill="#353b4b"/>
          <rect x="10" y="3" width="1" height="1" fill="#22d3ee"/>
          <rect x="11" y="4" width="1" height="1" fill="#22d3ee"/>
          <rect x="1" y="5" width="1" height="5" fill="#353b4b"/>
          <rect x="12" y="5" width="1" height="2" fill="#22d3ee"/>
          <rect x="7" y="6" width="2" height="1" fill="#353b4b"/>
          <rect x="7" y="7" width="1" height="1" fill="#353b4b"/>
          <rect x="9" y="7" width="3" height="1" fill="#353b4b"/>
          <rect x="8" y="8" width="1" height="1" fill="#353b4b"/>
          <rect x="9" y="9" width="1" height="1" fill="#353b4b"/>
          <rect x="2" y="10" width="1" height="1" fill="#353b4b"/>
          <rect x="10" y="10" width="1" height="2" fill="#353b4b"/>
          <rect x="3" y="11" width="1" height="1" fill="#353b4b"/>
          <rect x="2" y="12" width="2" height="1" fill="#353b4b"/>
          <rect x="10" y="12" width="2" height="1" fill="#353b4b"/>
          <rect x="1" y="13" width="1" height="2" fill="#353b4b"/>
          <rect x="12" y="13" width="1" height="2" fill="#353b4b"/>
          <rect x="0" y="15" width="14" height="1" fill="#22d3ee"/>

          <!-- Alabaster / slate knight body -->
          <rect x="5" y="2" width="4" height="1" fill="#f2f2ee"/>
          <rect x="4" y="3" width="6" height="1" fill="#f2f2ee"/>
          <rect x="4" y="4" width="7" height="1" fill="#e5e4df"/>
          <rect x="3" y="5" width="9" height="1" fill="#e5e4df"/>
          <rect x="3" y="6" width="4" height="1" fill="#d4d3cd"/>
          <rect x="9" y="6" width="3" height="1" fill="#d4d3cd"/>
          <rect x="3" y="7" width="4" height="1" fill="#d4d3cd"/>
          <rect x="3" y="8" width="5" height="1" fill="#a9a9a3"/>
          <rect x="3" y="9" width="6" height="1" fill="#a9a9a3"/>
          <rect x="4" y="10" width="6" height="1" fill="#a9a9a3"/>
          <rect x="4" y="11" width="6" height="1" fill="#8c8b85"/>
          <rect x="4" y="12" width="6" height="1" fill="#a9a9a3"/>
          <rect x="2" y="14" width="10" height="1" fill="#575652"/>

          <!-- Surgical Amber Mane & Pedestal Band -->
          <rect x="5" y="1" width="2" height="1" fill="#fbbf24"/>
          <rect x="4" y="2" width="1" height="1" fill="#fbbf24"/>
          <rect x="3" y="3" width="1" height="2" fill="#fbbf24"/>
          <rect x="2" y="5" width="1" height="5" fill="#fbbf24"/>
          <rect x="3" y="10" width="1" height="1" fill="#fbbf24"/>
          <rect x="2" y="13" width="10" height="1" fill="#fbbf24"/>

          <!-- Crisp Eye -->
          <rect x="7" y="3" width="1" height="1" fill="#0b101b"/>
        </g>
      </g>

      <!-- Right Sprite: Minimalist 12x15 Pixel Explorer Character (4px scale -> 48x60 at x=790, y=88) -->
      <g class="bob-b">
        <g transform="translate(790, 88) scale(4)" shape-rendering="crispEdges">
          <!-- Hood / Helmet -->
          <rect x="3" y="0" width="6" height="1" fill="#353b4b"/>
          <rect x="2" y="1" width="8" height="1" fill="#232732"/>
          <rect x="2" y="2" width="1" height="4" fill="#232732"/>
          <rect x="9" y="2" width="1" height="4" fill="#232732"/>
          <rect x="3" y="2" width="6" height="1" fill="#1c202b"/>
          <!-- Visor & Glowing Cyan Eyes -->
          <rect x="3" y="3" width="6" height="2" fill="#0b101b"/>
          <rect x="4" y="3" width="1" height="1" fill="#22d3ee"/>
          <rect x="7" y="3" width="1" height="1" fill="#22d3ee"/>
          <!-- Scarf / Collar Accent -->
          <rect x="2" y="5" width="8" height="1" fill="#22d3ee"/>
          <rect x="3" y="6" width="6" height="1" fill="#0284c7"/>
          <!-- Cloak / Jacket Torso -->
          <rect x="1" y="7" width="10" height="4" fill="#1c202b"/>
          <rect x="2" y="7" width="8" height="4" fill="#232732"/>
          <rect x="5" y="7" width="2" height="4" fill="#f2f2ee"/>
          <!-- Tiny Magenta Pin -->
          <rect x="8" y="8" width="1" height="1" fill="#f472b6"/>
          <!-- Belt -->
          <rect x="2" y="11" width="8" height="1" fill="#fbbf24"/>
          <!-- Legs & Boots -->
          <rect x="3" y="12" width="2" height="2" fill="#575652"/>
          <rect x="7" y="12" width="2" height="2" fill="#575652"/>
          <rect x="2" y="14" width="3" height="1" fill="#f2f2ee"/>
          <rect x="7" y="14" width="3" height="1" fill="#f2f2ee"/>
        </g>
      </g>

      <!-- Bezel Micro Footer -->
      <text x="768" y="177" class="mono" font-size="8.5" font-weight="500" fill="#767670" text-anchor="middle" letter-spacing="0.9">
        KNIGHT · OVERWORLD AVATAR
      </text>
    </g>
    <rect x="656" y="52" width="224" height="136" rx="8" fill="none" stroke="#252a38" stroke-width="1"/>

    <!-- Bottom Architectural Metadata Bar (35px) -->
    <rect x="1" y="204" width="898" height="35" fill="#161922"/>
    <line x1="1" y1="204" x2="899" y2="204" stroke="#232732" stroke-width="1"/>

    <text x="24" y="225" class="mono" font-size="10" fill="#a9a9a3" text-anchor="start">
      <tspan fill="#767670" font-weight="600">EDU  </tspan>
      <tspan fill="#f2f2ee" font-weight="500">Columbia MS CS · ASU BS CS (4.0)</tspan>
    </text>

    <line x1="364" y1="213" x2="364" y2="230" stroke="#232732" stroke-width="1"/>

    <text x="382" y="225" class="mono" font-size="10" fill="#a9a9a3" text-anchor="start">
      <tspan fill="#767670" font-weight="600">12M  </tspan>
      <tspan fill="#f2f2ee" font-weight="600">785</tspan>
      <tspan> contributions · </tspan>
      <tspan fill="#f2f2ee" font-weight="500">109</tspan>
      <tspan> PRs</tspan>
    </text>

    <line x1="654" y1="213" x2="654" y2="230" stroke="#232732" stroke-width="1"/>

    <text x="672" y="225" class="mono" font-size="10" text-anchor="start">
      <tspan fill="#767670" font-weight="600">SITE  </tspan>
      <tspan fill="#22d3ee" font-weight="500">adit-prabhu.github.io</tspan>
    </text>
  </g>

  <!-- Crisp 1px Outer Hairline Border -->
  <rect x="1" y="1" width="898" height="238" rx="10" fill="none" stroke="#232732" stroke-width="1"/>
</svg>
