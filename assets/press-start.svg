<svg xmlns="http://www.w3.org/2000/svg" width="460" height="64" viewBox="0 0 460 64" role="img" aria-labelledby="cta-title cta-desc">
  <title id="cta-title">Play Interactive 2D Portfolio | adit-prabhu.github.io</title>
  <desc id="cta-desc">Matte-obsidian architectural call-to-action pill with a 2D pixel gamepad accent linking to Adit Prabhu's interactive 2D portfolio at adit-prabhu.github.io.</desc>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .breathe { animation: lab-breathe 2.2s ease-in-out infinite; }
    @keyframes lab-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.38; }
    }
    @media (prefers-reduced-motion: reduce) {
      .breathe { animation: none; }
    }
  </style>

  <!-- Outer Matte-Obsidian Architectural Pill -->
  <rect x="1" y="1" width="458" height="62" rx="10" fill="#111318" stroke="#232732" stroke-width="1"/>

  <!-- Left Recessed 2D Pixel Gamepad Emblem Bezel -->
  <rect x="10" y="10" width="44" height="44" rx="7" fill="#0b101b" stroke="#252a38" stroke-width="1"/>
  <g transform="translate(18, 22) scale(2)" shape-rendering="crispEdges">
    <!-- Cyan L / R bumpers -->
    <rect x="2" y="0" width="3" height="1" fill="#22d3ee"/>
    <rect x="9" y="0" width="3" height="1" fill="#22d3ee"/>
    <!-- Alabaster / platinum shell -->
    <rect x="1" y="1" width="12" height="1" fill="#f2f2ee"/>
    <rect x="0" y="2" width="14" height="4" fill="#d4d3cd"/>
    <rect x="0" y="6" width="14" height="1" fill="#a9a9a3"/>
    <rect x="0" y="7" width="4" height="2" fill="#a9a9a3"/>
    <rect x="10" y="7" width="4" height="2" fill="#a9a9a3"/>
    <rect x="1" y="9" width="2" height="1" fill="#767670"/>
    <rect x="11" y="9" width="2" height="1" fill="#767670"/>
    <!-- D-pad with cyan pivot -->
    <rect x="3" y="2" width="1" height="3" fill="#111318"/>
    <rect x="2" y="3" width="3" height="1" fill="#111318"/>
    <rect x="3" y="3" width="1" height="1" fill="#22d3ee"/>
    <!-- Center pips -->
    <rect x="6" y="4" width="1" height="1" fill="#575652"/>
    <rect x="8" y="4" width="1" height="1" fill="#575652"/>
    <!-- Action buttons -->
    <rect x="10" y="2" width="1" height="1" fill="#fbbf24"/>
    <rect x="9" y="3" width="1" height="1" fill="#22d3ee"/>
    <rect x="11" y="3" width="1" height="1" fill="#f472b6"/>
    <rect x="10" y="4" width="1" height="1" fill="#34d399"/>
  </g>

  <!-- Center Architectural Copy -->
  <text x="66" y="27.5" class="mono" font-size="11.2" font-weight="700" fill="#f2f2ee" text-anchor="start" letter-spacing="0.7">
    PLAY INTERACTIVE 2D PORTFOLIO
  </text>

  <circle class="breathe" cx="70" cy="43" r="3" fill="#34d399"/>
  <text x="80" y="46.5" class="mono" font-size="10.2" font-weight="500" text-anchor="start" letter-spacing="0.3">
    <tspan fill="#22d3ee">adit-prabhu.github.io</tspan>
    <tspan fill="#767670"> · Live</tspan>
  </text>

  <!-- Right Monochrome-Inverted Architectural Action Button -->
  <rect x="372" y="16" width="76" height="32" rx="6" fill="#f2f2ee"/>
  <text x="410" y="35.5" class="mono" font-size="10.5" font-weight="700" fill="#111318" text-anchor="middle" letter-spacing="0.7">
    OPEN ▸
  </text>
</svg>
